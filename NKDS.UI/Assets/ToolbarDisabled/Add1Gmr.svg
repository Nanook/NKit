<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Three stacked rectangles representing grouped items -->
  <rect x="3" y="4" width="10" height="5" rx="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  <rect x="3" y="10" width="10" height="5" rx="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  <rect x="3" y="16" width="10" height="5" rx="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  <!-- Arrow pointing right into a target -->
  <path d="M15 9 L19 9 M17 7 L19 9 L17 11" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Target box -->
  <rect x="19" y="6" width="3" height="6" rx="0.5" fill="none" stroke="#666666" stroke-width="1.5"/>
  <!-- Plus sign -->
  <line x1="20.5" y1="15" x2="20.5" y2="21" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  <line x1="17.5" y1="18" x2="23.5" y2="18" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
</svg>
